[package]
name = "aish"
version = "1.0.3"
edition = "2021"
description = "CLI SSH + AI (Claude Code)"
license = "MIT"

[package.metadata.deb]
maintainer = "tryandhappy"
section = "utils"
assets = [
    ["target/release/aish", "usr/bin/", "755"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/aish", dest = "/usr/bin/aish", mode = "0755" },
]

[dependencies]
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
strip-ansi-escapes = "0.2"
dirs = "5"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_Globalization",
] }
