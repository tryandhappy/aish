name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (例: v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  BINARY_NAME: aish

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Linux は cross (Docker) でクロスコンパイルし deb/rpm も作る。
      # macOS は cargo でネイティブ/同SDKクロスコンパイル (x86_64 は arm ランナーから
      # クロス) し、tar.gz + 生バイナリのみ。deb/rpm は Linux 限定なので cross フラグで分岐。
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false

    steps:
      - uses: actions/checkout@v5

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      # macOS ランナーには sha256sum が無い (shasum はある)。Linux は従来どおり
      # sha256sum を使う。どちらも出力形式は `<64-hex>  <filename>` で同一なので
      # update.rs / SPEC.md の .sha256 パーサと互換 (空白2つ区切り)。
      - name: Select checksum tool
        id: sha
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            echo "cmd=sha256sum" >> "$GITHUB_OUTPUT"
          else
            echo "cmd=shasum -a 256" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (cargo)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Install packaging tools
        if: matrix.cross
        run: cargo install cargo-deb cargo-generate-rpm

      - name: Copy raw binary
        run: |
          cp "target/${{ matrix.target }}/release/${BINARY_NAME}" "${BINARY_NAME}-${{ matrix.target }}"
          ${{ steps.sha.outputs.cmd }} "${BINARY_NAME}-${{ matrix.target }}" > "${BINARY_NAME}-${{ matrix.target }}.sha256"

      - name: Package archive
        run: |
          ARCHIVE="${BINARY_NAME}-${{ steps.version.outputs.tag }}-${{ matrix.target }}"
          mkdir "$ARCHIVE"
          cp "target/${{ matrix.target }}/release/${BINARY_NAME}" "$ARCHIVE/"
          cp README.md "$ARCHIVE/" 2>/dev/null || true
          cp config.toml.example "$ARCHIVE/" 2>/dev/null || true
          tar czf "${ARCHIVE}.tar.gz" "$ARCHIVE"
          ${{ steps.sha.outputs.cmd }} "${ARCHIVE}.tar.gz" > "${ARCHIVE}.tar.gz.sha256"

      - name: Build deb package
        if: matrix.cross
        run: cargo deb --no-build --no-strip --target ${{ matrix.target }}

      - name: Build rpm package
        if: matrix.cross
        run: cargo generate-rpm --target ${{ matrix.target }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.target }}
          path: |
            ${{ env.BINARY_NAME }}-${{ matrix.target }}
            ${{ env.BINARY_NAME }}-${{ matrix.target }}.sha256
            ${{ env.BINARY_NAME }}-*.tar.gz
            ${{ env.BINARY_NAME }}-*.tar.gz.sha256
            target/${{ matrix.target }}/debian/*.deb
            target/${{ matrix.target }}/generate-rpm/*.rpm
          retention-days: 1

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Flatten artifact structure
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.sha256' -o -name '*.deb' -o -name '*.rpm' \) -exec mv {} dist/ \;
          # 生バイナリ (拡張子なし) は Linux musl と macOS darwin の両方を回収する
          find artifacts -type f \( -name 'aish-*-unknown-linux-musl' -o -name 'aish-*-apple-darwin' \) -exec mv {} dist/ \;
          ls -la dist/

      # SemVer のハイフン付きタグ (v0.9.0-rc.1, v0.9.0-beta.1 等) を prerelease として
      # 公開し、GitHub の `Latest` バッジを付けない (= 安定版チャネルには載せない)。
      # ハイフン無しタグ (v0.9.0) は prerelease=false で `Latest` に昇格する。
      # aish --update は安定版=/releases/latest, --prerelease=/releases 先頭 で取得する。
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: dist/*
          draft: false
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
