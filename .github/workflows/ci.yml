name: CI

# 全 push でテストを回す。release.yml (タグ push でのリリース) とは独立。
on: push

jobs:
  # fmt / clippy は OS 非依存 (どちらも unix で結果ほぼ同一) なので ubuntu 1 回に集約し、
  # macOS ランナーの消費を抑える。
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      # 構造的な clippy lint は trust-critical コードに #[allow] で抑制済み (src 参照)。
      # ここを通すには新規コードでも warning ゼロを保つこと。
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # aish は bin-only crate (src/lib.rs なし)。`cargo test --lib` だと
      # ターゲット不在で 0 件になるので、必ず `cargo test` を使う。
      - name: Test
        run: cargo test
